name: AWS App Deploy

# Re-applies the currently published runtime bundle to the instance and restarts the container.
#
# MANUAL ONLY, and no longer chained to AWS CDK Deploy. That workflow now applies the bundle itself,
# immediately after `cdk deploy` and before it verifies, because a deploy that publishes a bundle
# without applying it changes nothing on the instance while reporting success. Chaining this
# workflow off CDK Deploy's success also created a deadlock: when a first boot failed there was no
# container, so verification failed, so CDK Deploy failed, so this never ran, so the fixed bundle
# was never applied.
#
# What remains is the on-demand tool: re-run a rollout that failed, restart the container after
# touching something by hand, or re-apply after an instance replacement, without waiting for a
# CloudFormation deploy.
#
# Note what this does NOT do. The deployment runs a digest-pinned upstream image
# (ghcr.io/rmyndharis/openwa), so changes to this repository's application source do not reach the
# instance. Shipping fork-local code means building and publishing an image and moving
# openwa:imageRef to it, which is an infrastructure change because the digest lives in the CDK
# configuration.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack whose instance to apply the bundle to'
        required: false
        default: 'OpenwaStack'
        type: string

# Shares the infrastructure group: both end up running deploy.sh on the same instance, and two
# concurrent `docker compose up` invocations against one session volume is not worth risking.
concurrency:
  group: openwa-aws-infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Apply the runtime bundle over SSM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: deploy/aws/package-lock.json

      - name: Install dependencies
        working-directory: deploy/aws
        run: npm ci

      # Validated before anything is sent: a syntax error in deploy.sh would otherwise be discovered
      # on the machine that holds the WhatsApp session.
      #
      # This validates the bundle in the checkout, which is not necessarily the one published in S3 —
      # only `cdk deploy` publishes. If they differ, run AWS CDK Deploy instead; this workflow
      # applies whatever is currently published.
      - name: Validate the runtime bundle
        working-directory: deploy/aws
        run: bash scripts/validate-config.sh

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: openwa-app-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Apply the runtime bundle
        working-directory: deploy/aws
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ inputs.stack }}
        run: bash scripts/apply-runtime-bundle.sh

      - name: Verify the result
        working-directory: deploy/aws
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ inputs.stack }}
        run: bash scripts/verify-deployment.sh

      - name: Explain the failure
        if: failure()
        run: |
          cat <<'NOTE'
          Applying the runtime bundle failed.

          deploy.sh is written so that a failure leaves the session intact: it refuses to start when
          the persistent volume is not mounted or when authentication state has disappeared, it never
          removes a volume, and it rolls back to the previously running image when the new one does
          not pass validation.

          Where to look:
            1. The output printed above, which deploy.sh has already redacted.
            2. CloudWatch log group /openwa/OpenwaStack/system, stream <instance-id>/deploy
            3. On the instance, over Session Manager:
                 aws ssm start-session --target <instance-id>
                 sudo tail -n 200 /var/log/openwa-deploy.log
                 sudo tail -n 200 /var/log/openwa-bootstrap.log
                 sudo docker logs --tail 200 openwa

          If deploy.sh refused because authentication state is missing, do NOT remove the marker file
          to force it through until you understand why. Restoring the volume from an EBS snapshot
          keeps the session; starting fresh costs a QR re-scan.
          NOTE
